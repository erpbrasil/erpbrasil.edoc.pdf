name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    # Python 3.8 a 3.14 pelo setup-python. Cobre do Odoo 14 (3.8) ao Odoo 20 (3.14).
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: LibreOffice (converte o ODT renderizado em PDF) e cairo (pycairo do reportlab 4 em 3.11+)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer libcairo2-dev pkg-config
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
          python -m pip list | grep -iE "^(py3o|genshi|reportlab|lxml|erpbrasil) "
      - name: Test
        run: |
          pytest --cov --cov-report=term

  tests-legacy:
    # Python 3.6 e 3.7 (Odoo 12 e 13; o CI da OCA 12.0 roda 3.6) em container oficial.
    # So instalacao, import e CLI: o espelho do Debian bullseye nao serve mais o
    # LibreOffice, entao os testes de PDF ficam pulados aqui e rodam nos jobs 3.8+.
    name: Python ${{ matrix.python }} (container)
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-bullseye
    strategy:
      fail-fast: false
      matrix:
        python: ['3.6', '3.7']
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
      - name: Test
        run: |
          pytest

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  check-package:
    # Constroi o pacote e prova que ele nao apaga o __version__ da erpbrasil.edoc
    # nem quebra o namespace, com e sem as outras libs.
    name: Build & Inspect Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: cairo (pycairo do reportlab 4 em 3.11+)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcairo2-dev pkg-config
      - name: Build
        run: |
          python -m pip install --upgrade pip build check-wheel-contents twine
          python -m build
          check-wheel-contents dist/*.whl --ignore W002
          twine check --strict dist/*
          python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'erpbrasil/__init__.py' not in n and 'erpbrasil/edoc/__init__.py' not in n, n; assert 'erpbrasil/edoc/pdf/danfe.odt' in n, n"
      - name: Namespace with erpbrasil.edoc from PyPI and alone
        run: |
          python -m venv /tmp/ns && . /tmp/ns/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl erpbrasil.edoc
          python -c "from erpbrasil.edoc.pdf import base; from erpbrasil.edoc.nfe import NFe; import erpbrasil.edoc.pdf; print(erpbrasil.edoc.pdf.__version__)"
          python -m pip uninstall -y erpbrasil.edoc erpbrasil.transmissao erpbrasil.assinatura
          python -c "from erpbrasil.edoc.pdf import base; print('namespace ok sozinho')"
