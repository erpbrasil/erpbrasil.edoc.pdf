[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erpbrasil.edoc.pdf"
version = "1.3.0"
description = "Impressão de documentos fiscais a partir do XML (DANFE por template ODT e LibreOffice). Sem suporte: use a BrazilFiscalReport."
readme = "README.rst"
license = {text = "MIT"}
authors = [
  {name = "KMEE", email = "dev@kmee.com.br"},
]
keywords = ["DANFE", "NF-e", "PDF", "ODT", "LibreOffice"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# Piso 3.6: e o Python do CI da OCA para o Odoo 12.0, que ainda usa esta lib.
requires-python = ">=3.6"
dependencies = [
    "click",
    "erpbrasil.base",
    "genshi",
    "lxml",
    "py3o.template",
    "python-dateutil",
    "pytz",
    # So para o codigo de barras do DANFE (createBarcodeDrawing). Ate o Python 3.10 o
    # reportlab 3.6 tem wheel com o renderPM embutido (e o que o Odoo 14 em 3.8 usa);
    # o reportlab 4 desenha o PNG pelo rlPyCairo, que precisa da libcairo no sistema,
    # e o 3.6 nao tem wheel para 3.11+.
    "reportlab>=3.5,<4; python_version<'3.11'",
    "reportlab>=4; python_version>='3.11'",
    "rlPyCairo; python_version>='3.11'",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "coverage[toml]",
]
doc = [
    "sphinx>=1.3",
    "sphinx-rtd-theme",
]

[project.scripts]
erpbrasil-edoc-pdf = "erpbrasil.edoc.pdf.cli:main"

[project.urls]
Homepage = "https://github.com/erpbrasil/erpbrasil.edoc.pdf"
Changelog = "https://github.com/erpbrasil/erpbrasil.edoc.pdf/blob/master/CHANGELOG.rst"
"Issue Tracker" = "https://github.com/erpbrasil/erpbrasil.edoc.pdf/issues"
Substituta = "https://github.com/Engenere/BrazilFiscalReport"

# Esta lib e uma "portion" PEP 420 dos namespaces erpbrasil e erpbrasil.edoc: o wheel
# NAO leva src/erpbrasil/__init__.py nem src/erpbrasil/edoc/__init__.py. Quem define os
# dois e a erpbrasil.edoc (pkgutil.extend_path, que enxerga esta pasta); sem ela, o
# Python resolve os dois niveis como namespace implicito. Assim o __version__ da
# erpbrasil.edoc nao e mais apagado por este pacote.
[tool.hatch.build.targets.wheel]
packages = ["src/erpbrasil"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CONTRIBUTING.rst",
    "LICENSE",
    "README.rst",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.coverage.run]
branch = true
source = ["erpbrasil.edoc.pdf"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py37"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["erpbrasil"]
